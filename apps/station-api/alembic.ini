; Alembic CLI configuration.
;
; The application does NOT read this file: it builds an equivalent Config
; programmatically in station_api.db.migrations_runner so that migrations run
; on every launch. This file exists for manual CLI use, e.g.
;
;   uv run --project apps/station-api alembic revision -m "add identity"
;
; The version table is named schema_migrations; that is set in env.py, not
; here, so both the CLI and the programmatic path agree.

[alembic]
script_location = src/station_api/db/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite+pysqlite:///./station.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
