[project]
name = "station-api"
version = "0.1.0"
description = "Technocore Station - local-first FastAPI core (loopback only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Every direct dependency is justified in the root README.md dependency table.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "cryptography>=44,<47",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.20,<1.0",
    # Stage 3. The read-only Technocore client needs explicit control over the
    # things that make an outbound request safe: per-phase timeouts, redirects
    # off, and streaming so the body cap applies to decompressed bytes. httpx
    # gives all three directly; urllib would need hand-rolled equivalents on
    # the one code path where a mistake reaches the public internet.
    "httpx>=0.28,<1.0",
    "technocore-conform",
]

[dependency-groups]
# PyNaCl is a test dependency and nothing else. It gives AC-05 an Ed25519
# implementation that did not produce the signature being checked - the same
# libsodium binding the official server verifies with - so "our signature
# verifies" is not a claim `cryptography` makes about its own output. A
# security test asserts it is absent from every runtime dependency list.
# PyInstaller is a BUILD-TIME tool and nothing else. It freezes the
# application into packaging/artifacts/ (ADR-0010 2) and does not enter the
# artefact it produces: the bundle carries CPython, this project's runtime
# dependencies and PyInstaller's small C bootloader, not the packager. So the
# product's runtime dependency surface is unchanged by this line.
#
# Exact pin, not a range, for the reason every other pin in this repository
# exists (uv.lock, full-SHA action pins, the vendor commit pin): the bytes a
# packager emits are part of the artefact, and "whatever resolved today" is
# not a description of an artefact anyone can reproduce.
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "pynacl>=1.5,<2",
    "ruff>=0.8",
    "mypy>=1.14",
    "pyinstaller==6.16.0",
]

# Package boundary: technocore-conform is a separate, platform-independent
# package. station-api depends on it; never the reverse.
[tool.uv.sources]
technocore-conform = { path = "../../packages/technocore-conform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/station_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "S"]
ignore = [
    "S101", # assert is used for internal invariant checks
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["station_api"]

[[tool.mypy.overrides]]
module = ["uvicorn.*", "alembic.*"]
ignore_missing_imports = true
