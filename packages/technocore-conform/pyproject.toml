[project]
name = "technocore-conform"
version = "0.2.0"
description = "Technocore did:key conformance (signing and canonicalization arrive in Stage 2B)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Exactly one runtime dependency: cryptography, for Ed25519 key derivation.
#
# This package must stay importable without FastAPI, SQLAlchemy, SQLite or any
# Windows module: station-api depends on it, never the reverse.
dependencies = [
    "cryptography>=44,<47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_conform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
