[project]
name = "technocore-conform"
version = "0.3.0"
description = "Technocore write-contract conformance: sweep, canonical strings, did:key and Ed25519 signatures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Exactly one runtime dependency: cryptography, for Ed25519.
#
# This package must stay importable without FastAPI, SQLAlchemy, SQLite or any
# Windows module: station-api depends on it, never the reverse. The runtime
# self-test ships its vectors as package data, so it needs no vendor directory
# and no network either.
dependencies = [
    "cryptography>=44,<47",
]

[project.scripts]
technocore-conform = "technocore_conform.cli:main"

[dependency-groups]
# PyNaCl is a *test* dependency only, and must never enter the production
# import graph. It provides an independently written Ed25519 implementation so
# AC-05 is verified by something other than the library that produced the
# signature. A test asserts it is absent from the runtime dependencies above.
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "pynacl>=1.5,<2",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_conform"]

[tool.hatch.build.targets.sdist]
# The sdist carries the package and its metadata, never the Apache-2.0 vendor
# reference, which lives outside this directory entirely.
include = [
    "src/technocore_conform",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

# The same rule set station-api uses. This package was previously left on
# ruff's defaults, which check almost nothing; holding the protocol code to a
# lower standard than the application around it was an oversight.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "S"]
ignore = [
    "S101", # assert is used for internal invariant checks
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["technocore_conform"]
