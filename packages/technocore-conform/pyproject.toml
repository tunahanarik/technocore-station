[project]
name = "technocore-conform"
version = "0.0.1"
description = "Technocore canonicalization and signature conformance (Stage 2B - not implemented yet)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Deliberately zero dependencies in Stage 1.
#
# This package must stay importable without FastAPI, SQLAlchemy, SQLite or any
# Windows module: station-api depends on it, never the reverse. Stage 2B adds
# exactly one runtime dependency, cryptography, for Ed25519.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_conform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
