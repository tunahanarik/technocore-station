[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --strict-config
markers =
    security: security regression tests. These must never be skipped, xfailed or weakened (AGENTS.md INV-06).
    integration: local end-to-end tests. Never touch the real Technocore (INV-05).
    conformance: differential tests against the pinned vendor oracle (Stage 2B).
